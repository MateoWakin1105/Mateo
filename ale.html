<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jaba srkep</title>
</head>
<body>
<h1>Hello BSIS!</h1>
    <table border="1" cellpadding="10">
        <tbody>
            <tr id="row">
                <td id="studentName">Matchew Wakin</td>
                <td>
                    <button id="editBtn">Edit</button>
                </td>
            </tr>
        </tbody>
    </table>

<form id="editor" hidden>
    <label>Student Name <input id="nameInput" required>
    </label>
    <button>Save</button>
</form>
<script>
const row = document.querySelector('#row') ;
const editor = document.querySelector ('#editor') ;
const nameInput = document.querySelector('#nameInput') ; 
const studentName = document.querySelector('#studentName') ;
function openEditor() {
    editor.hidden = false;
    nameInput.value = studentName.textContent;
    nameInput.focus();
} 
row.addEventListener('dblclick', openEditor);
document.querySelector('#editBtn') .addEventListener('click', openEditor);
editor.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!nameInput.value.trim()) return;
    studentName.textContent = nameInput.value.trim();
    editor.hidden = true;
});
</script>

</body>
</html>
