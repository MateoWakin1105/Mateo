
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Management System</h1>

    <h3>Add Student</h3>

    <form id="studentForm">
        <input type="text" id="name"
               placeholder="Enter Name" required>
        <br><br>

        <input type="email" id="email"
               placeholder="Enter Email" required>
        <br><br>

        <select id="course" required>
            <option value="">Select Course</option>
            <option>BSIS</option>
            <option>BSAIS</option>
            <option>ENGINEERING</option>
            <option>NURSING</option>
        </select>
        <br><br>

        <button type="submit">Add Student</button>
    </form>

    <h3>Student List</h3>

    <table border="1" cellpadding="5">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentList"></tbody>
    </table>

    <p id="message"></p>

    <script>
        let students = [];
        let editIndex = -1;

        const form = document.getElementById("studentForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let course = document.getElementById("course").value;

            let student = {
                name: name,
                email: email,
                course: course
            };

            if (editIndex === -1) {
                students.push(student);

                document.getElementById("message").textContent =
                    "Student added successfully!";
            } else {
                students[editIndex] = student;
                editIndex = -1;

                document.getElementById("message").textContent =
                    "Student updated successfully!";

                form.querySelector("button[type='submit']")
                    .textContent = "Add Student";
            }

            form.reset();
            showStudents();
        });

        function showStudents() {
            let list = document.getElementById("studentList");

            list.innerHTML = "";

            students.forEach(function(student, index) {
                let row = list.insertRow();

                row.insertCell(0).textContent = student.name;
                row.insertCell(1).textContent = student.email;
                row.insertCell(2).textContent = student.course;

                let action = row.insertCell();

                let editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.type = "button";
                editButton.onclick = function() {
                    editStudent(index);
                };

                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.type = "button";
                deleteButton.onclick = function() {
                    deleteStudent(index);
                };

                action.append(editButton, deleteButton);
            });

            if (list.rows.length === 0) {
                let row = list.insertRow();
                let cell = row.insertCell();
                cell.colSpan = 4;
                cell.textContent = "No student records found.";
            }
        }

        function editStudent(index) {
            let student = students[index];

            document.getElementById("name").value = student.name;
            document.getElementById("email").value = student.email;
            document.getElementById("course").value = student.course;

            editIndex = index;

            form.querySelector("button[type='submit']")
                .textContent = "Update Student";

            document.getElementById("message").textContent =
                "Edit the information, then click Update Student.";
        }

        function deleteStudent(index) {
            if (confirm("Are you sure you want to delete this student?")) {
                students.splice(index, 1);

                if (editIndex === index) {
                    editIndex = -1;
                    form.reset();

                    form.querySelector("button[type='submit']")
                        .textContent = "Add Student";
                } else if (editIndex > index) {
                    editIndex--;
                }

                showStudents();

                document.getElementById("message").textContent =
                    "Student deleted successfully!";
            }
        }

        showStudents();
    </script>

</body>
</html>
